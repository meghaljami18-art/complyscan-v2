[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "complyscan-api"
version = "1.0.0"
description = "Evidence-first COMPLYSCAN FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "SQLAlchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
